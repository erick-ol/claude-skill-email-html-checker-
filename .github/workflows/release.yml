name: Release ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: bash make-zip.sh

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: "Download `email-html-checker.zip` and upload it in Claude.ai → Settings → Customize → Skills → +"
          files: email-html-checker.zip
